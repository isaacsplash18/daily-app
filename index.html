<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Hybrid" />
<meta name="theme-color" content="#0a0a0a" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-180.png" />
<title>Hybrid Training</title>
<style>
  :root{
    --bg:#0a0a0a; --panel:#171717; --panel2:#1f1f1f; --line:#2a2a2a;
    --ink:#e5e5e5; --ink2:#a3a3a3; --ink3:#737373; --ink4:#525252;
    --amber:#fbbf24; --red:#f87171; --green:#34d399; --sky:#38bdf8;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    padding:24px 16px calc(40px + env(safe-area-inset-bottom));}
  .wrap{max-width:480px;margin:0 auto}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--sky)}
  h1{margin:4px 0 0;font-size:26px;letter-spacing:-.02em;color:#fafafa}
  .lead{margin:6px 0 0;font-size:12px;color:var(--ink3)}
  .count{border:1px solid rgba(56,189,248,.3);background:rgba(56,189,248,.06);border-radius:12px;
    padding:14px;margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .cdays{font-family:var(--mono);font-size:30px;font-weight:700;color:var(--sky);line-height:1}
  .clbl{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);margin-top:3px}
  .cright{text-align:right}
  .crace{font-size:13px;font-weight:600;color:var(--ink)}
  .cmeta{font-size:11px;color:var(--ink3);margin-top:2px}
  .card{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:16px;margin-top:16px}
  .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3)}
  .maxes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
  .maxes label{display:block}
  .maxes span{display:block;text-align:center;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);margin-bottom:4px}
  input{font-family:var(--mono);background:var(--bg);border:1px solid #3a3a3a;border-radius:6px;
    color:var(--ink);text-align:center;padding:8px 2px;width:100%;font-size:14px}
  input:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
  .maxes input{color:var(--amber);font-weight:700}
  .strip{display:flex;gap:6px;overflow-x:auto;padding:16px 0 4px;-webkit-overflow-scrolling:touch}
  .wk{position:relative;flex:0 0 auto;width:40px;height:48px;border:1px solid var(--line);background:var(--panel);
    border-radius:9px;color:var(--ink2);font-weight:600;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:4px;cursor:pointer;font-family:var(--mono)}
  .wk.active{background:var(--sky);border-color:var(--sky);color:#0a0a0a}
  .wk.now{box-shadow:0 0 0 1px var(--amber)}
  .wk.old{color:var(--ink3)}
  .wk.old.active{background:var(--amber);border-color:var(--amber);color:#0a0a0a}
  .wkdiv{flex:0 0 auto;width:22px;height:48px;display:flex;align-items:center;justify-content:center;color:var(--ink4);font-family:var(--mono);font-size:12px}
  .power{border:1px solid rgba(52,211,153,.3);background:rgba(52,211,153,.06);border-radius:9px;padding:12px;margin-bottom:14px}
  .powerh{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--green)}
  .powerm{font-size:14px;font-weight:600;color:var(--ink);margin-top:4px}
  .powers{font-size:12px;color:var(--ink2);margin-top:4px}
  .obanner{border:1px solid rgba(251,191,36,.3);background:rgba(251,191,36,.06);border-radius:12px;padding:14px;margin-top:16px;font-size:12px;color:#fde68a}
  .obanner b{color:#fff}
  .rew{border-color:rgba(52,211,153,.3)}
  .rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
  .rt2{text-align:center}
  .rv{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--green);line-height:1}
  .rv small{font-size:11px;color:var(--ink4);font-weight:500}
  .rl{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink4);margin-top:4px}
  .rsub{font-family:var(--mono);font-size:10px;color:var(--ink3);margin-top:10px;text-align:center}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .badge2{border:1px solid rgba(52,211,153,.35);background:rgba(52,211,153,.08);color:var(--green);border-radius:6px;padding:3px 7px;font-size:11px}
  .nextb{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:12px;font-size:12px;color:var(--ink2)}
  .nextb b{color:var(--ink)} .nextb .p{font-family:var(--mono);font-size:10px;color:var(--ink3)}
  .bar{height:4px;background:#2a2a2a;border-radius:2px;margin-top:6px;overflow:hidden}
  .bar div{height:100%;background:var(--green);border-radius:2px}
  .day.mob{border-color:rgba(52,211,153,.3)}
  .mobhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .rt small{font-size:13px;color:var(--ink4)}
  .mobsec{margin:16px 0 2px;color:var(--green)}
  .mobrow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
  .mobsec+.mobrow{border-top:none}
  .mobtxt{flex:1;min-width:0}
  .mobtop{display:flex;justify-content:space-between;gap:8px}
  .mobname{font-size:13px;color:var(--ink)}
  .mobtop .p{font-family:var(--mono);font-size:11px;color:var(--ink3);white-space:nowrap}
  .mobcue{font-size:11px;color:var(--ink3);margin-top:2px;line-height:1.45}
  .mobrow.done .mobname{text-decoration:line-through;opacity:.5}
  .mobrow.done .mobcue{opacity:.4}
  .dot{width:4px;height:4px;border-radius:50%}
  .wk .plane{position:absolute;top:3px;right:4px;font-size:9px;color:var(--sky);font-family:var(--sans)}
  .wkhead{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
  .badge{border:1px solid;border-radius:5px;padding:2px 6px;font-family:var(--mono);font-size:10px;
    letter-spacing:.15em;text-transform:uppercase;margin-left:8px}
  .dates{font-family:var(--mono);font-size:10px;color:var(--ink4);margin-top:3px}
  .donecount{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--green);margin-left:8px}
  .hint{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink4)}
  .tbanner{border:1px solid rgba(56,189,248,.3);background:rgba(56,189,248,.06);border-radius:9px;
    padding:12px;font-size:12px;color:#bae6fd;margin-top:16px}
  .sched{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:6px;margin-top:16px}
  .srow{display:flex;align-items:center;gap:10px;padding:8px}
  .srow .d{width:34px;font-family:var(--mono);font-size:12px;color:var(--ink3)}
  .srow .a{font-size:14px}
  .srow .s{font-size:12px;color:var(--ink4)}
  .srow.trow{background:rgba(56,189,248,.06);border-radius:8px}
  .srow.today{background:rgba(251,191,36,.07);border-radius:8px}
  button.srow{width:100%;background:none;border:none;color:inherit;font:inherit;text-align:left;cursor:pointer;border-radius:8px}
  .srow.arr{border:1px dashed #3a3a3a;margin:3px 0}
  .srow.arr.pick{border:1px solid var(--amber);background:rgba(251,191,36,.10)}
  .srow.arr.fixed{opacity:.45;cursor:default}
  .grip{flex:none;width:24px;text-align:center;color:var(--amber);font-size:14px}
  .mvtag{flex:none;margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);border:1px solid rgba(251,191,36,.4);border-radius:4px;padding:1px 5px}
  .wkhead .hbtns{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .arrbtn{border:1px solid #3a3a3a;background:transparent;color:var(--ink2);border-radius:7px;padding:4px 9px;font-size:11px;cursor:pointer;font-family:var(--sans)}
  .arrbtn.on{border-color:var(--amber);color:var(--amber)}
  .arrbar{border:1px solid rgba(251,191,36,.3);background:rgba(251,191,36,.06);border-radius:9px;padding:10px 12px;margin-top:16px;font-size:12px;color:#fde68a;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .arrbar .arrbtn{flex:none}
  .frisel{display:flex;align-items:center;gap:8px;margin-top:16px}
  .frisel .hint{margin-right:auto}
  .frisel .arrbtn{padding:6px 14px;font-size:12px}
  .indoor{display:flex;align-items:center;gap:14px;margin-top:12px}
  .psi{font-size:11px;color:var(--sky);text-decoration:none}
  .run.inside{border-color:rgba(163,163,163,.35)}
  .warnb{border:1px solid rgba(248,113,113,.35);background:rgba(248,113,113,.06);border-radius:9px;padding:10px 12px;margin-top:10px;font-size:12px;color:#fecaca}
  .chk{flex:none;width:24px;height:24px;border:1px solid #3a3a3a;background:transparent;color:var(--green);
    border-radius:6px;font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .chk.on{border-color:var(--green);background:rgba(52,211,153,.14)}
  .srow.done .a{text-decoration:line-through}
  .srow.done .a,.srow.done .s{opacity:.5}
  .planebtn{margin-left:auto;flex:none;width:28px;height:28px;border:1px solid #2a2a2a;background:transparent;
    color:var(--ink4);border-radius:7px;font-size:13px;cursor:pointer;line-height:1}
  .planebtn.on{border-color:var(--sky);background:rgba(56,189,248,.12);color:#7dd3fc}
  .run{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:16px;margin-top:16px}
  .run.key{border-color:rgba(56,189,248,.35)}
  .run.race{border-color:rgba(248,113,113,.45);background:rgba(248,113,113,.05)}
  .rtop{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .rname{font-size:14px;font-weight:600;color:var(--ink)}
  .rspec{font-family:var(--mono);font-size:12px;color:var(--ink3);margin-top:2px}
  .rt{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--sky);line-height:1;text-align:right}
  .run.race .rt{color:var(--red)}
  .runit{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink4);text-align:right;margin-top:2px}
  .rnote{font-size:12px;color:var(--ink2);margin-top:8px}
  .howbtn{display:block;margin-top:10px;background:none;border:none;color:var(--sky);font-size:12px;padding:0;cursor:pointer;font-family:var(--sans)}
  .howbody{margin-top:8px;font-size:12px;color:var(--ink2);line-height:1.5;border-left:2px solid var(--line);padding-left:10px}
  .howbody ol{margin:0 0 8px;padding-left:18px}
  .howbody li{margin:3px 0}
  .howbody p{margin:6px 0}
  .howbody b{color:var(--ink);font-weight:600}
  .howt{font-family:var(--mono);font-size:11px;color:var(--ink3)}
  .effort{font-size:11px;color:var(--ink3)}
  .day{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:16px;margin-top:16px}
  .dhead{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);margin-bottom:14px}
  .main{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
  .main:first-of-type{border-top:none;padding-top:0;margin-top:0}
  .mtop{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .mname{font-size:14px;font-weight:600;color:var(--ink)}
  .mspec{font-family:var(--mono);font-size:12px;color:var(--ink3);margin-top:2px}
  .wt{font-family:var(--mono);font-size:30px;font-weight:700;color:var(--amber);line-height:1;text-align:right}
  .unit{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink4);text-align:right;margin-top:2px}
  .mnote{font-size:12px;color:var(--ink2);margin-top:6px}
  .fallback{font-size:12px;color:var(--ink2);margin-top:6px}
  .fallback b{color:var(--ink);font-weight:600}
  .logrow{display:flex;align-items:center;gap:8px;margin-top:8px}
  .logrow input{width:56px}
  .setn{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink4);width:38px}
  input::placeholder{color:var(--ink4)}
  .x{font-family:var(--mono);color:var(--ink4);font-size:12px}
  .acc{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
  .acc li{font-size:12px;color:var(--ink2);list-style:none;padding:3px 0}
  .acc li+li{border-top:1px solid var(--line);margin-top:10px;padding-top:12px}
  .acctop{display:flex;justify-content:space-between}
  .accstart{font-family:var(--mono);font-size:10px;color:var(--ink4);margin-top:1px}
  .accnote{font-size:10px;color:var(--ink4);margin:4px 0 4px}
  .acc ul{margin:6px 0 0;padding:0}
  .acc .p{font-family:var(--mono);color:var(--ink3)}
  .warm{border:1px solid var(--line);background:#0d0d0d;border-radius:9px;padding:10px 12px;margin-bottom:14px}
  .warmh{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);opacity:.85}
  .warmi{font-size:12px;color:var(--ink);margin-top:4px}
  .ramp{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-top:6px}
  .ramp b{color:var(--ink2);font-weight:600}
  .ref{border:1px solid var(--line);background:var(--panel);border-radius:12px;margin-top:16px}
  .ref>button{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;
    border:none;color:var(--ink2);padding:16px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    font-weight:600;cursor:pointer;font-family:var(--sans)}
  .refbody{padding:0 16px 16px}
  .ref h4{margin:0 0 4px;font-size:13px;color:var(--ink)}
  .ref p{margin:0 0 14px;font-size:12px;color:var(--ink2);line-height:1.5}
  .ref p:last-child{margin-bottom:0}
  .reset{display:block;background:none;border:none;color:var(--ink4);font-size:12px;cursor:pointer}
  .btnrow{display:flex;gap:18px;justify-content:center;margin-top:18px}
  .copybtn{margin-top:14px;width:100%;background:transparent;border:1px solid #2a2a2a;color:var(--ink2);
    border-radius:9px;padding:9px;font-size:12px;font-weight:500;cursor:pointer;font-family:var(--sans)}
  .copybtn:active{border-color:var(--amber);color:var(--amber)}
  .foot{text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#404040;margin-top:18px}
  .g{color:var(--green)} .a{color:var(--amber)} .r{color:var(--red)} .sk{color:var(--sky)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const RACE={name:"BYD Singapore International Marathon",event:"Half Marathon · 21.1 km",date:"2026-12-06",meta:"F1 Pit Building → National Stadium · 3h45 cut-off"};
const START="2026-09-28"; // Monday of week 1
const BLOCK="hm26";

const WEEKS=[
 {n:1,phase:"Base",pct:.70,long:12,lnote:"Conversational the whole way. If you can't talk, slow down.",
  q:{n:"Fartlek",s:"6 × 1 min @ 5k effort",d:"Easy 5 km around it, jog 90 s between reps. Gentle re-entry — you've had time off."},sets:3,easy:[5,5]},
 {n:2,phase:"Base",pct:.725,long:14,lnote:"Same easy effort, just longer. Nothing heroic.",
  q:{n:"Fartlek",s:"8 × 1 min @ 5k effort",d:"Jog 90 s between. Finish feeling you could have done two more."},sets:3,easy:[5,6]},
 {n:3,phase:"Build",pct:.75,long:15,lnote:"Last 3 km a touch quicker if it genuinely feels good.",
  q:{n:"Intervals",s:"5 × 3 min @ 10k effort",d:"Jog 2 min between. Controlled — this is not a race."},sets:3,easy:[6,6]},
 {n:4,phase:"Cutback",pct:.675,long:11,lnote:"Cutback week. Keep it properly easy — this is where you absorb the work.",
  q:{n:"Easy + strides",s:"6 × 20 s strides",d:"After an easy 5 km. Walk back to full recovery between each."},sets:2,easy:[5,5]},
 {n:5,phase:"Build",pct:.75,long:16,lnote:"Start practising race fuelling and your drink here.",
  q:{n:"Tempo",s:"3 × 8 min @ half pace",d:"90 s jog between. This effort is your goal race pace — learn how it feels."},sets:3,easy:[6,6]},
 {n:6,phase:"Build",pct:.775,long:17,lnote:"Longest so far. Settle in early, stay patient.",
  q:{n:"Tempo",s:"4 × 8 min @ half pace",d:"90 s jog between. Should feel 'comfortably hard', never desperate."},sets:3,easy:[6,7]},
 {n:7,phase:"Cutback",pct:.70,long:13,lnote:"Cutback. Let the legs come back up before the peak.",
  q:{n:"Intervals",s:"5 × 3 min @ 10k effort",d:"Jog 2 min between. Sharp but short."},sets:2,easy:[5,6]},
 {n:8,phase:"Peak",pct:.75,long:19,lnote:"Peak long run. Full dress rehearsal — race kit, race breakfast, race fuelling.",
  q:{n:"Tempo",s:"2 × 15 min @ half pace",d:"3 min jog between. The key session of the whole block."},sets:2,easy:[6,7]},
 {n:9,phase:"Taper",pct:.70,long:14,lnote:"Taper starts. Volume drops, effort stays sharp. Resist adding anything.",
  q:{n:"Sharpener",s:"4 × 3 min @ 10k effort",d:"Jog 2 min. Should feel springy, not tiring."},sets:2,easy:[5,5]},
 {n:10,phase:"Race",pct:.60,long:21.1,lnote:"RACE DAY. Go out slower than feels right for the first 5 km — you'll thank yourself at 18.",
  q:{n:"Primer",s:"3 × 2 min @ race pace",d:"Three days out from the race. Short and sharp, then rest up and eat well."},sets:1,easy:[4,4]}];

const RACE_WEEK=WEEKS.length; // race week is always the last week

// "How to do it" for each session: numbered steps, how it should feel, why, total time.
const EFFORT="Easy: you can talk in full sentences. Half-marathon pace: comfortably hard, a short sentence at most. 10k effort: hard but controlled, a few words at a time. 5k effort: hard, a word or two.";
const WU="Warm up with 10–15 min easy, then 3–4 strides (20 s quick and relaxed).",CD="Cool down with 10 min easy.";
const QHOW={
 1:{sum:"Easy running with 6 one-minute surges — your first speed work back.",
    steps:["Run 10 min easy to warm up.","Do 6 surges: 1 min at 5k effort, then 90 s easy jogging. Keep moving the whole time — the jog is your recovery.","Finish with 10 min easy."],
    feel:"Surges are hard but smooth, never a sprint. You should finish feeling you could have done a couple more.",
    why:"Reminds your legs how to run faster after the time off. Each surge is short, so the risk is low.",total:"about 35 min"},
 2:{sum:"Easy running with 8 one-minute surges.",
    steps:["Run 10 min easy to warm up.","Do 8 surges: 1 min at 5k effort, then 90 s easy jogging. Keep moving the whole time.","Finish with 10 min easy."],
    feel:"Same effort as last week, two more reps. Finish feeling you could have done two more.",
    why:"Builds on week 1 with a bit more fast running before the harder sessions start.",total:"about 40 min"},
 3:{sum:"5 × 3 min at 10k effort, with 2 min jogs between.",
    steps:[WU,"Run 5 × 3 min at 10k effort, jogging easy for 2 min between each.",CD],
    feel:"Hard but controlled — a few words at a time. Your last rep should be about as fast as your first; if you're fading badly, you started too quick.",
    why:"Raises your aerobic ceiling, so half-marathon pace starts to feel easier.",total:"about 50 min"},
 4:{sum:"Easy 5 km, then 6 short strides.",
    steps:["Run 5 km easy — conversational, about 30–35 min. This is also your warm-up.","Do 6 strides of 20 s: build up over 5 s, hold fast-but-relaxed for 10 s, ease off over 5 s.","Walk back to the start between each one, 60–90 s, until your breathing settles.","Optional: a few minutes of easy jogging to finish."],
    feel:"Strides are about 85–90% — quick, light and smooth, never flat-out. Stand tall, short quick steps, loose shoulders. You should finish springy, not tired.",
    why:"Cutback week: keeps your legs used to moving quickly without adding fatigue, so you absorb the training before the next build.",total:"about 40–45 min"},
 5:{sum:"3 × 8 min at half-marathon pace, with 90 s jogs.",
    steps:[WU,"Run 3 × 8 min at half-marathon pace, jogging easy for 90 s between each.",CD],
    feel:"Comfortably hard — you could say a short sentence but wouldn't want to chat. All three reps should feel the same.",
    why:"This is your goal race effort. Practising it teaches you what race pace feels like, so you don't go off too fast on the day.",total:"about 55 min"},
 6:{sum:"4 × 8 min at half-marathon pace, with 90 s jogs.",
    steps:[WU,"Run 4 × 8 min at half-marathon pace, jogging easy for 90 s between each.",CD],

function num(v){var n=parseFloat(String(v==null?"":v).replace(",","."));return isNaN(n)?0:n;}
function stats(){
  var st={sessions:0,runs:0,km:0,longest:0,swims:0,swimM:0,cf:0,cardio:0,sets:0,kg:0,lifts:0,streak:0,best:0,mobility:0};
  Object.keys(S.sessions).forEach(function(k){if(S.sessions[k])st.sessions++;});
  Object.keys(S.runs).forEach(function(k){var r=S.runs[k]||{};if(!(r.km||r.t||r.min||r.note))return;
    if(/:cf$/.test(k)){if(r.min||r.note)st.cf++;return;}
    if(/:cardio$/.test(k)){st.cardio++;return;}
    if(/:swim$/.test(k)){st.swims++;st.swimM+=num(r.km);}else{st.runs++;var d=num(r.km);st.km+=d;if(/:long$/.test(k)&&d>st.longest)st.longest=d;}});
  var liftKeys={};
  Object.keys(S.logs).forEach(function(k){var sets=(S.logs[k]||{}).sets||[];sets.forEach(function(x){if(!x||!fmtSet(x))return;st.sets++;var w=num(x.w),r=num(x.r);if(w&&r)st.kg+=w*r;
    var wk=k.indexOf(BLOCK)===0?BLOCK+k.slice(BLOCK.length).split(":")[0]:k.split(":")[0];liftKeys[wk]=1;});});
  st.lifts=Object.keys(liftKeys).length;
  // a mobility session counts once 75% of that week's routine is ticked
  st.mobility=WEEKS.filter(function(w){if(w.n<MOB_FROM)return false;var n=0,c=0;
    MOB.forEach(function(m,i){if(w.n===RACE_WEEK&&m[5])return;n++;if(S.mob[BLOCK+w.n+":mob:"+i])c++;});return c>=Math.ceil(n*0.75);}).length;
  // a week "counts" with 4+ sessions ticked; streak = consecutive counted weeks ending at the latest one
  var done=function(pre){return SCHED.filter(function(x){return !!S.sessions[pre+x[0]];}).length>=4;};
  var seq=OLD_WEEKS.map(function(w){return done(w.n+":");}).concat(WEEKS.map(function(w){return done(BLOCK+w.n+":");}));
  var run=0;seq.forEach(function(d){run=d?run+1:0;if(run>st.best)st.best=run;});
  var cw=currentWeek(),i=OLD_WEEKS.length+cw-1;if(!seq[i])i--;      // this week may still be in progress
  while(i>=0&&seq[i]){st.streak++;i--;}
  return st;}

// Move every log, run, checkmark and travel flag of one half-marathon week to another.
function moveWeek(from,to){
  var mv=function(obj,pf,pt){var out={};Object.keys(obj).forEach(function(k){
    if(k.indexOf(pt)===0)return;             // target's old data is dropped (caller confirmed)
    out[k.indexOf(pf)===0?pt+k.slice(pf.length):k]=obj[k];});return out;};
  S.logs=mv(S.logs,BLOCK+from+":",BLOCK+to+":");S.sessions=mv(S.sessions,BLOCK+from+":",BLOCK+to+":");
  S.travel=mv(S.travel,BLOCK+from+":",BLOCK+to+":");S.mob=mv(S.mob,BLOCK+from+":",BLOCK+to+":");
  var mf=S.moves[from];delete S.moves[to];if(mf){S.moves[to]=mf;delete S.moves[from];}
  var ff=S.fri[from];delete S.fri[to];if(ff){S.fri[to]=ff;delete S.fri[from];}S.indoor=mv(S.indoor,from+":",to+":");S.runs=mv(S.runs,from+":",to+":");

const RM_NAMES=[["squat","Back squat"],["bench","Bench press"],["deadlift","Deadlift"],["ohp","Overhead press"]];
function csvCell(v){v=(v==null?"":String(v));return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function buildCSV(){
  var rows=[["Category","Week","Day","Item","Set","Weight","Reps","Distance","Time","Done","Key"]];
  rows.push(["Meta","","","dates fixed (28 Sep)","","","","","","","shift28"]);
  RM_NAMES.forEach(function(m){rows.push(["Max","","",m[1],"",S.oneRMs[m[0]]==null?"":S.oneRMs[m[0]],"","","","",m[0]]);});
  for(var wk=1;wk<=WEEKS.length;wk++){
    [["long","Long run",longDay(wk)],["quality","Quality",qDay(wk)||""],["easy","Easy run",""],["swim","Swim",dispDay(wk,"Fri")],["cardio","Indoor cardio",dispDay(wk,"Fri")]].forEach(function(s){

      if((lg.km&&lg.km!=="")||(lg.t&&lg.t!==""))rows.push([s[0]==="swim"?"Swim":s[0]==="cardio"?"Cardio":"Run",wk,s[2],s[1],"","","",lg.km||"",lg.t||"","",key]);});
    mainsFor(wk).forEach(function(m){
      var key=BLOCK+wk+":"+m.k,sets=(S.logs[key]||{}).sets||[];
      sets.forEach(function(st,si){if(st&&((st.w!=null&&st.w!=="")||(st.r!=null&&st.r!=="")))rows.push(["Lift",wk,liftDay(wk),m.name,si+1,st.w||"",st.r||"","","","",key]);});});
    accFor(wk).forEach(function(a,idx){
      var key=BLOCK+wk+":acc:"+idx,sets=(S.logs[key]||{}).sets||[];
      sets.forEach(function(st,si){if(st&&((st.w!=null&&st.w!=="")||(st.r!=null&&st.r!=="")))rows.push(["Accessory",wk,liftDay(wk),a[0],si+1,st.w||"",st.r||"","","","",key]);});});
  }
  Object.keys(S.sessions).forEach(function(key){if(S.sessions[key])rows.push(["Session","","","","","","","","","yes",key]);});
  Object.keys(S.mob).forEach(function(key){if(!S.mob[key])return;var p=key.slice(BLOCK.length).split(":"),it=MOB[+p[2]];
    rows.push(["Mobility",p[0],mobDay(+p[0]),it?it[1]:"","","","","","","yes",key]);});
  for(var cw=1;cw<=WEEKS.length;cw++){var cl=S.runs[cw+":cf"]||{};if(cl.min||cl.note)rows.push(["CrossFit",cw,dispDay(cw,"Fri"),cl.note||"","","","","",cl.min||"","",cw+":cf"]);}
  Object.keys(S.indoor).forEach(function(k){if(S.indoor[k]){var p=k.split(":");rows.push(["Indoor",p[0],"",p[1],"","","","","","yes",k]);}});
  Object.keys(S.fri).forEach(function(wk){if(S.fri[wk])rows.push(["Friday",wk,"",S.fri[wk]==="cf"?"CrossFit":"Swim","","","","","","",wk+":fri"]);});
  Object.keys(S.moves).forEach(function(wk){var m=S.moves[wk]||{};DAYS7.forEach(function(d){if(m[d]&&m[d]!==d)rows.push(["Move",wk,d,m[d],"","","","","","",wk+":"+d]);});});
  // Anything logged in an earlier block stays exportable.
  Object.keys(S.logs).forEach(function(key){

    sets.forEach(function(st,si){if(st&&((st.w!=null&&st.w!=="")||(st.r!=null&&st.r!==""))){var L=legacyLabel(key)||{};rows.push(["Legacy",L.week||"",L.day||"",L.name||"",si+1,st.w||"",st.r||"","","","",key]);}});});
  return rows.map(function(r){return r.map(csvCell).join(",");}).join("\n");
}
function downloadCSV(btn){

    var blob=new Blob([buildCSV()],{type:"text/csv;charset=utf-8"});
    var url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download="hybrid-training-log.csv";document.body.appendChild(a);a.click();

function parseCSV(text){
  var rows=[],row=[],cur="",i=0,inQ=false,c;text=String(text).replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  while(i<text.length){c=text[i];
    if(inQ){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else inQ=false;}else cur+=c;}
    else{if(c==='"')inQ=true;else if(c===",")row.push(cur),cur="";else if(c==="\n"){row.push(cur);rows.push(row);row=[];cur="";}else cur+=c;}
    i++;}
  if(cur!==""||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function importCSV(text){
  var rows=parseCSV(text);if(!rows.length)return false;
  var head=rows[0].map(function(h){return h.trim().toLowerCase();}),ci={};
  ["category","week","day","item","set","weight","reps","distance","time","done","key"].forEach(function(n){ci[n]=head.indexOf(n);});
  if(ci.category<0||ci.key<0)return false;
  var nLogs={},nRuns={},nSess={},nTrav={},nMob={},nMoves={},nFri={},nIndoor={},nRMs=Object.assign({},S.oneRMs),fixed=false;
  var g=function(r,n){return ci[n]>=0?(r[ci[n]]||"").trim():"";};
  for(var i=1;i<rows.length;i++){
    var r=rows[i];if(!r||!r.length||r.every(function(x){return(x||"").trim()==="";}))continue;
    var cat=g(r,"category"),key=g(r,"key"),wt=g(r,"weight"),rp=g(r,"reps");
    if(cat==="Max"){if(key)nRMs[key]=wt===""?"":Number(wt);}
    else if(cat==="Run"||cat==="Swim"||cat==="Cardio"){if(!key)continue;var km=g(r,"distance"),tm=g(r,"time");nRuns[key]=nRuns[key]||{};if(km!=="")nRuns[key].km=km;if(tm!=="")nRuns[key].t=tm;}
    else if(cat==="Lift"||cat==="Main"||cat==="Accessory"||cat==="Legacy"){
      if(!key)continue;var si=parseInt(g(r,"set"),10);if(isNaN(si)||si<1)continue;
      var e=nLogs[key]=nLogs[key]||{sets:[]};e.sets[si-1]=e.sets[si-1]||{};
      if(wt!=="")e.sets[si-1].w=wt;if(rp!=="")e.sets[si-1].r=rp;}
    else if(cat==="Session"){if(key)nSess[key]=true;}
    else if(cat==="Mobility"){if(key)nMob[key]=true;}
    else if(cat==="CrossFit"){if(!key)continue;var cm=g(r,"time"),cn=g(r,"item");nRuns[key]={};if(cm!=="")nRuns[key].min=cm;if(cn!=="")nRuns[key].note=cn;}
    else if(cat==="Indoor"){if(key)nIndoor[key]=true;}
    else if(cat==="Friday"){var fw=key.split(":")[0];if(fw)nFri[fw]=g(r,"item")==="CrossFit"?"cf":"swim";}
    else if(cat==="Move"){var mp=key.split(":"),it2=g(r,"item");if(mp.length===2&&DAYS7.indexOf(mp[1])>=0&&DAYS7.indexOf(it2)>=0){(nMoves[mp[0]]=nMoves[mp[0]]||{})[mp[1]]=it2;}}
    else if(cat==="Travel"){if(key)nTrav[key]=true;}
    else if(cat==="Meta"){if(key==="shift28")fixed=true;}
  }
  S.oneRMs=nRMs;S.logs=nLogs;S.runs=nRuns;S.sessions=nSess;S.travel=nTrav;S.mob=nMob;S.fri=nFri;S.indoor=nIndoor;
  Object.keys(nMoves).forEach(function(wk){DAYS7.forEach(function(d){if(!nMoves[wk][d])nMoves[wk][d]=d;});});S.moves=nMoves;
  // A file from the old app (before the date fix) still has the haze-period weeks one ahead: fix them the same way.
  delete S.shiftNote;
  if(!fixed){try{localStorage.setItem("ss_state_before_shift28",JSON.stringify(S));}catch(e){}
    var nm=shiftBackOneWeek();if(nm)S.shiftNote=nm;}
  S.shift28=true;S.week=currentWeek();S.view="new";persist();render();return true;
}

      'Upper body can keep building: when every set of a pull feels solid, add a rep or a little weight. Legs stay on maintenance. RPE 7–8, never to failure. Short on time? Alternate sets — pull-ups with calf raises, rows with knee raises.')+'</div>'+
    '<ul>'+accFor(S.week).map(accHTML).join("")+'</ul></div></div>';
}
function render(){
  if(S.view==="old")return renderOld();
  var w=WEEKS[S.week-1],td=todayDay(),isNow=(S.week===currentWeek());
  var doneCount=SCHED.filter(function(s){return !!S.sessions[K()+":"+s[0]];}).length;
  var d2r=daysToRace();
  document.getElementById("app").innerHTML=
  '<div class="eyebrow">Half Marathon Block</div>'+
  '<h1>The Half</h1>'+
  '<p class="lead">Ten weeks. One gym day. The long run is the block.</p>'+

  (S.shiftNote?'<div class="obanner"><b>Dates fixed.</b> The block runs from 28 Sep again, so this is week '+currentWeek()+'. '+
    'Everything you logged one tab ahead since 11 Oct has moved back a week to its real dates ('+S.shiftNote+' entries). '+
    'From now on, log in the week the app shows.'+
    '<div class="btnrow" style="justify-content:flex-start;margin-top:10px"><button class="arrbtn on" data-act="shift-ok">Looks right</button>'+
    '<button class="arrbtn" data-act="shift-undo">Undo</button></div></div>':'')+
  '<div class="count"><div><div class="cdays">'+(d2r>0?d2r:0)+'</div><div class="clbl">'+(d2r>0?"days to go":d2r===0?"race day":"done")+'</div></div>'+
  '<div class="cright"><div class="crace">Sun 6 Dec · '+RACE.event+'</div><div class="cmeta">'+RACE.name+'</div><div class="cmeta">'+RACE.meta+'</div></div></div>'+
  rewardHTML()+

  maxesHTML("Coming back from time off — set these ~10% under your old numbers and earn them back.")+
  stripHTML()+

  '<div class="wkhead"><div><b>Week '+S.week+'</b>'+
  '<span class="badge" style="color:'+PHASE[w.phase]+';border-color:'+PHASE[w.phase]+'">'+w.phase+'</span>'+
  (doneCount?'<span class="donecount">'+doneCount+' done</span>':'')+
  '<div class="dates">'+weekRange(S.week)+(isNow?' · this week':'')+'</div></div>'+
  '<div class="hbtns"><span class="hint">tap ✓ when done</span>'+
  '<button class="arrbtn'+(arranging?' on':'')+'" data-act="arrange">'+(arranging?'Done':'⇅ Move days')+'</button></div></div>'+
  (arranging?'<div class="arrbar"><span>'+(picked?'Now tap the day to swap <b>'+picked+'</b> with.':'Tap a day, then the day to swap it with.')+'</span>'+
    (moveMap(S.week)?'<button class="arrbtn" data-act="arrange-reset">Reset week</button>':'')+'</div>':'')+
  moveWarnings(S.week).map(function(t){return '<div class="warnb">'+esc(t)+'</div>';}).join("")+

  schedHTML(weekRows(S.week).map(function(r){return [r[0],r[1],r[2],null,null,r[4],r[5]];}),K()+":",isNow,td,S.week===RACE_WEEK)+

  (ovr(S.week).extraLong?(function(e){var pw=WEEKS[e.from-1];return runHTML("long",dispDay(S.week,e.day),"Long run (moved from Sun, haze)",pw.long,"km","week "+e.from+"'s long run, easy",ovr(S.week).longNote,"key",null,e.from);})(ovr(S.week).extraLong):"")+
  (isIndoor(S.week,"long")
    ?runHTML("long",dispDay(S.week,"Sun"),"Long run · treadmill",w.long,"km","indoors, haze","Treadmill, same distance, same easy effort. This week: "+w.lnote,"key inside",null,null,indoorBtn("long"),howHTML("long",LONG_IN_HOW))
    :runHTML("long",(ovr(S.week).longDay?"Wed":dispDay(S.week,"Sun")),(S.week===RACE_WEEK?"RACE — BYD Half":(ovr(S.week).longTitle||"Long run")),w.long,"km","easy, conversational",(S.week===RACE_WEEK?w.lnote:"This week: "+w.lnote),(S.week===RACE_WEEK?"race":"key"),null,null,S.week===RACE_WEEK?"":indoorBtn("long"),howHTML(S.week===RACE_WEEK?"race":"long",S.week===RACE_WEEK?RACE_HOW:LONG_HOW)))+
  ((qDay(S.week)||(S.runs[S.week+":quality"]||{}).km||(S.runs[S.week+":quality"]||{}).t)?(isIndoor(S.week,"quality")
      ?runHTML("quality",qDay(S.week)||"—",w.q.n+" · treadmill",w.q.s,"session","indoors, haze",QHOW[S.week].sum+" On the treadmill.","key inside",null,null,indoorBtn("quality"),howHTML("quality",qHow(S.week,true),qExtra(S.week,true)))
      :runHTML("quality",qDay(S.week)||"—",w.q.n,w.q.s,"session",(S.week===4?"cutback week, light speed work":S.week===RACE_WEEK?"race week tune-up":"the one hard run"),QHOW[S.week].sum,"key",null,null,indoorBtn("quality"),howHTML("quality",qHow(S.week,false),qExtra(S.week,false)))):"")+
  friHTML()+

  mobHTML()+
  liftHTML()+
  '<button class="copybtn" data-act="copyweek" data-lbl="Copy this week">Copy this week</button>'+

  '<div class="ref"><button data-act="ref">How to run it<span>'+(S.ref?'▲':'▼')+'</span></button>'+
  (S.ref?'<div class="refbody">'+
    '<h4>Easy means easy</h4>'+
    '<p>Roughly <span class="g">80%</span> of your running should be conversational — able to speak full sentences. Most people ruin a block by running their easy days too hard and their hard days too soft. The quality run and the Sunday long run are the only two that matter; everything else is just getting blood to the legs.</p>'+
    '<h4>Strength is maintenance now</h4>'+
    '<p>One session a week holds your strength for 8–12 weeks — that is well established, and it is all you need through a race build. What actually preserves strength is <span class="a">intensity, not volume</span>, so squat and bench are built like a proper maintenance day: work up to <b>one clean top triple</b> at 77–85%, then a couple of crisp back-off fives. Brace hard, own the descent, never grind a rep. The conventional deadlift stays out — it costs more recovery than it returns while you are running — but the Romanian deadlift is now a real lift off your deadlift max, not an afterthought, because a strong posterior chain is your best protection against running injuries. Rows and pull-ups keep the back honest; the <span class="a">calf raises are not optional</span> — they are the cheapest achilles insurance you will ever buy.</p>'+
    '<h4>Building the upper body</h4>'+
    '<p>From week 3 the lift moves to Tuesday and the overhead press joins the bench every week. Pressing and pulling cost your running almost nothing, so unlike your legs, your upper body does not have to sit on maintenance: when the bench top triple or every set of 6 overhead feels comfortable, raise that max and let the app recalculate. Pull-ups go first while you are fresh, then the dumbbell row, which works the back without loading the lower back straight after Romanian deadlifts.</p>'+
    '<h4>Sprints with your friend</h4>'+
    '<p>The Thursday sprints replace the quality run; they are never added on top of it. All-out sprinting is the most common cause of hamstring strains, and strains are your injury pattern, so stay around 85–90% for the first few weeks, warm up properly first, and stop the moment a hamstring tightens. From week 5 the tempo comes first and the sprints are a short finish. Race week has none.</p>'+
    '<h4>Monday mobility</h4>'+
    '<p>Stretching on its own does not prevent injuries; the trials are clear on that. What it does do is improve range of motion and ease the tightness you feel, and for <span class="a">muscle strains</span> specifically there is some evidence it helps. So Monday mixes long holds for your tight areas with a few minutes of strength work: bridge walkouts, slow calf lowers and a foam-roller squeeze for the groin. That strength is what makes hamstrings, calves and groin harder to strain. It starts in week 3 and only needs a mat, a foam roller, a ball and a wall. Keep it gentle, because it is the day after your long run. Finishing every exercise ticks Monday off for you. If the same spot keeps getting hurt, have a physio assess it; a routine cannot find the cause.</p>'+
    '<h4>Boxing alongside the running</h4>'+
    '<p>Boxing is excellent aerobic work with low running impact, which is exactly why it survived the rebuild and the HIIT did not. Wednesday is the full session. Saturday stays light and technical — pads, footwork and drills, no hard conditioning rounds — because you run long the next morning. Friday is a swim or a CrossFit class, your call. Only <span class="a">two</span> sessions each week are meant to be hard: the quality run and the long run. Everything else stays genuinely easy, and that is what lets the two that matter be good.</p>'+
    '<h4>Haze</h4>'+
    '<p>The long run, quality run and swim each have a <b>Move indoors</b> button. Runs go to the treadmill at the same distance and a 1% incline; the swim becomes 25–30 min of easy cardio on a bike, elliptical or rower. Rule of thumb: if the PSI is over 100, take it indoors.</p>'+
    '<h4>Cutback and taper weeks</h4>'+
    '<p>Weeks <span class="g">4 and 7</span> are cutbacks and weeks <span class="g">9–10</span> are the taper. You get fitter during these, not during the hard weeks. The taper is where discipline matters most: the fitness is already banked, and nothing you add in the last fortnight will help you — but plenty could hurt you.</p>'+
    '<h4>Race day</h4>'+
    '<p>Week 8 is your dress rehearsal — race kit, race breakfast, race fuelling, nothing new. On the day, run the first 5 km slower than feels right. A half is won in the last 5 km, and the cut-off is 3h45, so there is no need to panic early.</p>'+
    '<h4>If something hurts</h4>'+
    '<p>You are coming back from injury. Sharp pain, or any niggle that changes how you run, means stop that session — not push through it. Missing one run costs nothing; missing three weeks costs the race.</p>'+
  '</div>':'')+'</div>'+

  footerHTML();
  scrollStrip();
}

const app=document.getElementById("app");
app.addEventListener("input",function(e){
  var t=e.target;
  if(t.dataset.rm){
    var v=t.value;S.oneRMs[t.dataset.rm]=v===""?"":Number(v);persist();
    if(S.view==="old")Object.keys(OLD_PROG).forEach(function(k){var el=document.getElementById("wt-"+k);if(el){var W=oldW(k);el.textContent=W?fmt(W):"—";}});
    else mainsFor(S.week).forEach(function(m){var el=document.getElementById("wt-"+m.k);if(el){var B=bigW(m);el.textContent=B?fmt(B):"—";}});
  }else if(t.dataset.log){
    var key=t.dataset.log,si=+t.dataset.set,f=t.dataset.f;
    var o=S.logs[key]=S.logs[key]||{};var arr=o.sets=o.sets||[];arr[si]=arr[si]||{};arr[si][f]=t.value;persist();
  }else if(t.dataset.run){
    var rk=t.dataset.run;var ro=S.runs[rk]=S.runs[rk]||{};ro[t.dataset.f]=t.value;persist();
  }
});
app.addEventListener("change",function(e){
  if(e.target.id!=="csvfile")return;
  var f=e.target.files&&e.target.files[0];e.target.value="";
  if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    if(!confirm("Import this file? It replaces the training data on THIS device. Export first if unsure."))return;
    if(!importCSV(String(rd.result)))alert("Couldn't read that file. Make sure it's a CSV exported from this app.");
  };
  rd.readAsText(f);
});
app.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.week){arranging=false;picked=null;S.view="new";S.week=Number(b.dataset.week);persist();render();}
  else if(b.dataset.oweek){arranging=false;picked=null;S.view="old";S.oweek=Number(b.dataset.oweek);persist();render();}
  else if(b.dataset.act==="move"){
    var from=S.week,ans=prompt("Move ALL of week "+from+"'s logs (runs, lifts, checkmarks) to which week? (1–"+WEEKS.length+")");
    if(ans==null)return;var to=parseInt(ans,10);
    if(isNaN(to)||to<1||to>WEEKS.length||to===from){alert("Pick a different week between 1 and "+WEEKS.length+".");return;}
    if(weekHasData(to)&&!confirm("Week "+to+" already has logs. They will be REPLACED by week "+from+"'s. Continue?"))return;
    moveWeek(from,to);}
  else if(b.dataset.act==="shift-ok"){delete S.shiftNote;persist();render();}
  else if(b.dataset.act==="shift-undo"){if(confirm("Put your logs back where they were (one week ahead)?")){if(!undoShift())alert("No backup found.");render();}}
  else if(b.dataset.how){var hid=b.dataset.how;if(S.how[hid])delete S.how[hid];else S.how[hid]=true;persist();render();}
  else if(b.dataset.indoor){var ik=S.week+":"+b.dataset.indoor;if(S.indoor[ik])delete S.indoor[ik];else S.indoor[ik]=true;persist();render();}
  else if(b.dataset.fri){S.fri[S.week]=b.dataset.fri;persist();render();}
  else if(b.dataset.act==="arrange"){arranging=!arranging;picked=null;render();}
  else if(b.dataset.act==="arrange-reset"){delete S.moves[S.week];picked=null;persist();render();}
  else if(b.dataset.pick){var d=b.dataset.pick;
    if(!picked)picked=d;else if(picked===d)picked=null;else{swapDays(S.week,picked,d);picked=null;}
    render();}
  else if(b.dataset.sess){var k=K()+":"+b.dataset.sess;if(S.sessions[k])delete S.sessions[k];else S.sessions[k]=true;persist();render();}
  else if(b.dataset.mob){var mk=K()+":mob:"+b.dataset.mob;
    if(S.mob[mk])delete S.mob[mk];
    else{S.mob[mk]=true;if(mobItems().every(function(x){return S.mob[K()+":mob:"+x.i];})){var mt=ovr(S.week).mobTick;S.sessions[mt?BLOCK+mt[0]+":"+mt[1]:K()+":Mon"]=true;}} // finishing the routine ticks Monday
    persist();render();}
  else if(b.dataset.act==="mobopen"){S.mobOpen=!(S.mobOpen!==false);persist();render();}
  else if(b.dataset.act==="copyweek"){copyText(S.view==="old"?oldSessionText():sessionText(),b);}
  else if(b.dataset.act==="copyall"){copyText(fullLogText(),b);}
  else if(b.dataset.act==="ref"){S.ref=!S.ref;render();}
  else if(b.dataset.act==="export"){downloadCSV(b);}
  else if(b.dataset.act==="import"){var fi=document.getElementById("csvfile");if(fi)fi.click();}
  else if(b.dataset.act==="reset"){if(confirm("Clear all logged runs and sets? Your maxes stay.")){S.logs={};S.runs={};persist();render();}}
});
render();
</script>
